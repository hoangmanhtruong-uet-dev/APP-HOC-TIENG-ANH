<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện nghe chép chính tả | Indigo Scholar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C0E1D; --panel:#141731; --panel2:#1B1F40; --line:#2B3060;
  --text:#EEF0FF; --mute:#98A0CF; --indigo:#5B5FEF; --indigo-hi:#7C80FF; --mark:#F6E85C; --ok:#5EE0A0; --bad:#FF6A82; --amber:#F5B73D;
  --head:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--text);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,a,input,textarea{font:inherit;color:inherit}
button,a{cursor:pointer;background:none;border:0;text-decoration:none}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px;border-radius:8px}
h2{font:800 22px var(--head);letter-spacing:-.025em}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}

nav{position:sticky;top:0;z-index:20;background:rgba(12,14,29,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:28px;height:68px;max-width:1240px}
.brand{display:flex;align-items:center;gap:12px;font:800 19px var(--head);letter-spacing:-.02em;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--indigo);display:grid;place-items:center;font-size:13px}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.links a{padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500;white-space:nowrap;position:relative}
.links a:hover,.links a.on{color:var(--text)}
.links a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:var(--mark)}
.me{width:36px;height:36px;border-radius:50%;background:var(--indigo);display:grid;place-items:center;font:700 14px var(--head);border:2px solid var(--panel2)}

main{padding:40px 0 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.head h1{font:800 clamp(28px,4vw,42px)/1.05 var(--head);letter-spacing:-.035em}
.head p{color:var(--mute);margin-top:8px;max-width:52ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.b2{height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;display:flex;align-items:center;gap:8px;transition:border-color .15s}
.b2:hover{border-color:var(--indigo-hi)}
.b2 b{background:var(--mark);color:var(--ink);border-radius:99px;font-size:12px;padding:0 8px}
.btn{padding:15px 26px;border-radius:14px;font:800 16px var(--head);background:var(--indigo);transition:.15s}
.btn:hover:not(:disabled){background:var(--indigo-hi);transform:translateY(-1px)}
.btn:disabled{background:var(--panel2);color:var(--mute);cursor:not-allowed}
.btn.ghost{background:none;border:1.5px solid var(--line);font-weight:700}
.btn.ghost:hover{border-color:var(--indigo-hi);background:var(--panel)}
.btn.mk{background:var(--mark);color:var(--ink)}

/* stats */
.strip{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:20px;background:var(--panel);margin-bottom:28px}
.strip>div{padding:18px 24px;border-left:1px solid var(--line)}
.strip>div:first-child{border:0}
.strip small{display:block;color:var(--mute);font-size:13px}
.strip b{font:800 28px/1.2 var(--head);letter-spacing:-.03em}

/* filters */
.fl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;max-width:400px;display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel)}
.search:focus-within{border-color:var(--indigo-hi)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.search input::placeholder{color:var(--mute)}
.seg{display:flex;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;color:var(--mute);font-weight:600;font-size:14px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--indigo);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:26px}
.chip{padding:10px 18px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute);font-weight:600;white-space:nowrap;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--indigo-hi)}
.chip[aria-pressed=true]{background:var(--mark);border-color:var(--mark);color:var(--ink)}

/* lesson cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{--a:var(--ok);background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;text-align:left;transition:border-color .15s,transform .15s;position:relative}
.card:hover{border-color:var(--a);transform:translateY(-3px)}
.card .cat{color:var(--mute);font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.card h3{font:800 20px/1.2 var(--head);letter-spacing:-.02em;margin-bottom:8px}
.card p{color:var(--mute);font-size:14px;flex:1;margin-bottom:18px}
.meta{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:14px}
.lv{font:700 12px var(--body);padding:3px 11px;border-radius:99px;color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent)}
.best{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-bottom:16px}
.best .t{flex:1;height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.best .t i{display:block;height:100%;background:var(--a);border-radius:6px}
.best b{color:var(--text)}
.cta{padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:center;transition:.15s}
.card:hover .cta{background:var(--a);border-color:var(--a);color:var(--ink)}
.del{position:absolute;right:14px;top:14px;color:var(--mute);width:28px;height:28px;border-radius:8px}
.del:hover{background:var(--panel2);color:var(--bad)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--mute)}
.empty h2{color:var(--text);margin-bottom:6px}

/* player */
.pl{max-width:780px;margin:0 auto}
.pl-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.back{color:var(--mute);font-weight:600;padding:8px 4px}
.back:hover{color:var(--text)}
.pl-top h2{flex:1;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;gap:6px;margin-bottom:8px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.prog i.g{background:var(--ok)}.prog i.y{background:var(--amber)}.prog i.r{background:var(--bad)}
.prog i.now{background:var(--mark)}
.pmeta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:26px}
.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:26px;padding:clamp(22px,4vw,40px)}
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px}
.play{width:92px;height:92px;border-radius:50%;background:var(--indigo);display:grid;place-items:center;transition:transform .15s,background .15s;box-shadow:0 0 0 10px rgba(91,95,239,.15)}
.play:hover{transform:scale(1.05);background:var(--indigo-hi)}
.play svg{display:block}
.play .bars{display:none;gap:4px;align-items:center;height:30px}
.play .bars i{width:5px;border-radius:3px;background:var(--mark);animation:bar .8s ease-in-out infinite}
.play .bars i:nth-child(2){animation-delay:.15s}.play .bars i:nth-child(3){animation-delay:.3s}.play .bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{0%,100%{height:8px}50%{height:28px}}
.play.on svg{display:none}.play.on .bars{display:flex}
.lrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--mute);font-size:14px}
.sp{display:flex;gap:4px}
.sp button{padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--mute)}
.sp button[aria-pressed=true]{border-color:var(--mark);color:var(--mark)}
.replay{color:var(--indigo-hi);font-weight:600}
.replay:hover{color:var(--text)}
.ans{width:100%;padding:18px 20px;border-radius:16px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font:500 20px var(--body);outline:0;transition:border-color .15s}
.ans:focus{border-color:var(--indigo-hi)}
.cloze{font:500 21px/2.4 var(--body);text-align:center;padding:6px 0}
.cloze input{width:auto;text-align:center;background:var(--ink);border:0;border-bottom:3px solid var(--mark);border-radius:8px 8px 0 0;padding:2px 8px;margin:0 4px;font:600 21px var(--body);color:var(--text);outline:0}
.cloze input:focus{background:var(--panel2)}
.hintline{min-height:28px;margin-top:12px;color:var(--mark);font-size:15px}
.hintline s{text-decoration:none;color:var(--mute)}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.row .sp2{margin-left:auto}
.kbd{font:600 11px var(--body);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:8px;color:var(--mute)}

.res{animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.score{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.score b{font:800 56px/1 var(--head);letter-spacing:-.05em}
.score span{color:var(--mute)}
.diff{font:500 21px/1.9 var(--body);padding:18px 20px;border-radius:16px;background:var(--ink);border:1.5px solid var(--line)}
.w{margin-right:.28em;padding:1px 4px;border-radius:6px}
.w.ok{color:var(--ok)}
.w.miss{background:rgba(246,232,92,.18);color:var(--mark);text-decoration:underline wavy;text-underline-offset:5px}
.w.extra{color:var(--bad);text-decoration:line-through;opacity:.85}
.w.plain{color:var(--text)}
.w.bad{color:var(--bad)}
.leg{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.leg i{font-style:normal;padding:0 6px;border-radius:5px}

/* result page */
.big{text-align:center;padding:10px 0 28px}
.big b{font:800 clamp(72px,14vw,120px)/1 var(--head);letter-spacing:-.06em;display:inline-block;padding:0 .1em;position:relative;isolation:isolate}
.big b::after{content:"";position:absolute;left:0;right:0;bottom:.1em;height:.2em;background:var(--mark);z-index:-1;border-radius:4px}
.big p{color:var(--mute);margin-top:6px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:26px}
.kp div{padding:16px 20px;border-left:1px solid var(--line)}
.kp div:first-child{border:0}
.kp small{display:block;color:var(--mute);font-size:13px}
.kp b{font:800 24px var(--head)}
.sl{display:grid;gap:8px;margin:12px 0 26px}
.sl div{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.sl b{font:800 18px var(--head);text-align:center;padding:4px 0;border-radius:10px}
.sl b.g{color:var(--ok);background:rgba(94,224,160,.12)}.sl b.y{color:var(--amber);background:rgba(245,183,61,.12)}.sl b.r{color:var(--bad);background:rgba(255,106,130,.12)}
.mw{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.mw button{padding:7px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.mw button:hover{border-color:var(--indigo-hi)}
.mw button span{color:var(--mute);margin-left:6px}

dialog{background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-radius:24px;padding:28px;width:min(560px,92vw);margin:auto}
dialog::backdrop{background:rgba(5,6,16,.7);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:6px}
dialog p.s{color:var(--mute);margin-bottom:18px;font-size:14px}
dialog input,dialog textarea{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--ink);outline:0;margin-bottom:12px}
dialog input:focus,dialog textarea:focus{border-color:var(--indigo-hi)}
dialog textarea{min-height:170px;resize:vertical}
.drow{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.wl{max-height:50vh;overflow:auto;display:grid;gap:6px;margin-bottom:12px}
.wl div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--panel2)}
.wl strong{flex:1;font:700 17px var(--head)}
.wl small{color:var(--mute)}
.wl button{width:30px;height:30px;border-radius:8px;color:var(--mute)}
.wl button:hover{background:var(--panel);color:var(--text)}
.note{padding:12px 16px;border-radius:12px;background:rgba(245,183,61,.12);color:var(--amber);font-size:14px;margin-bottom:18px}
.err{color:var(--bad);font-size:13px;min-height:20px}

@media(max-width:700px){
  nav .wrap{gap:12px}.brand span{display:none}
  .strip,.kp{grid-template-columns:1fr}
  .strip>div,.kp div{border-left:0;border-top:1px solid var(--line)}
  .strip>div:first-child,.kp div:first-child{border-top:0}
  .row .sp2{margin-left:0}
  .ans{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav><div class="wrap">
  <div class="brand"><div class="logo">IS</div><span>Indigo Scholar</span></div>
  <div class="links"><a href="#">Home</a><a href="#">Learn</a><a class="on" href="#">Dictation</a><a href="#">Plans</a><a href="#">Roadmap</a><a href="#">Progress</a><a href="#">Pricing</a><a href="#">Profile &amp; Settings</a></div>
  <div class="me">H</div>
</div></nav>
<main class="wrap" id="app"></main>

<dialog id="dNew">
  <h2>Tạo bài từ văn bản của bạn</h2>
  <p class="s">Dán một đoạn tiếng Anh. Mình sẽ tách thành từng câu để bạn luyện nghe chép.</p>
  <input id="nTitle" placeholder="Tên bài (không bắt buộc)" maxlength="60">
  <textarea id="nText" placeholder="Dán đoạn văn tiếng Anh ở đây..."></textarea>
  <div class="err" id="nErr"></div>
  <div class="drow"><button class="btn ghost" id="nCancel">Huỷ</button><button class="btn" id="nOk">Tạo bài</button></div>
</dialog>
<dialog id="dNote">
  <h2>Sổ từ nghe sai</h2>
  <p class="s">Những từ bạn hay gõ sai. Bấm loa để nghe lại.</p>
  <div class="wl" id="wl"></div>
  <div class="drow"><button class="btn ghost" id="noteClose">Đóng</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- dữ liệu mẫu ---------- */
const BASE=[
 {id:'cafe',cat:'Giao tiếp',lv:'Cơ bản',title:'Daily Conversation: At the Coffee Shop',desc:'Luyện nghe đoạn hội thoại tại quán cà phê. Phù hợp cho người mới bắt đầu.',dur:'0:45',s:['Hi, can I get a medium latte, please?','Sure, would you like that hot or iced?','Hot, please, and with oat milk instead of regular.','That will be five dollars and fifty cents.','Thanks, I will wait over there by the window.']},
 {id:'dir',cat:'Giao tiếp',lv:'Cơ bản',title:'Asking for Directions',desc:'Hỏi đường và chỉ đường trong thành phố, câu ngắn và rõ ràng.',dur:'0:40',s:['Excuse me, how do I get to the train station?','Go straight for two blocks and turn left at the bank.','Is it far from here, or can I walk?','It takes about ten minutes on foot.']},
 {id:'gen',cat:'Tổng hợp',lv:'Cơ bản',title:'Everyday Life',desc:'Các câu thường gặp về thói quen, gia đình và kế hoạch cuối tuần.',dur:'0:50',s:['I usually wake up at six and go for a short walk.','My brother works in a bank near the city center.','We are planning a trip to the mountains this weekend.','She forgot her umbrella, so she got wet on the way home.','It is a lot cheaper to cook at home than to eat out.']},
 {id:'off',cat:'Công sở',lv:'Trung bình',title:'Office Meeting Talk',desc:'Cụm từ họp hành: báo cáo, lịch hẹn, hạn chót và đề xuất.',dur:'1:10',s:["Let's go over the quarterly report before the meeting starts.","I'll send you the updated figures by the end of the day.",'Could we reschedule the call to Thursday afternoon?','The deadline has been moved to the first of next month.','Please let me know if you have any questions about the proposal.']},
 {id:'news',cat:'Tin tức',lv:'Trung bình',title:'City News Bulletin',desc:'Bản tin ngắn về giao thông công cộng, giọng đọc tin tức rõ ràng.',dur:'1:00',s:['The city council approved a new plan to expand public transport.','Officials expect construction to begin early next year.','Residents have welcomed the decision, citing heavy traffic.','The project is estimated to cost around two hundred million dollars.']},
 {id:'int',cat:'Công sở',lv:'Nâng cao',title:'Job Interview',desc:'Câu hỏi và trả lời phỏng vấn, từ vựng nghề nghiệp nâng cao.',dur:'1:15',s:['Tell me about a time you worked under pressure.','I managed a team of five during a tight product launch.','What do you consider your greatest professional strength?','I believe my adaptability helps me solve problems quickly.']},
 {id:'aca',cat:'Học thuật',lv:'Nâng cao',title:'Sleep and Memory Study',desc:'Đoạn nghiên cứu khoa học: từ vựng học thuật, câu dài, liên từ phức.',dur:'1:20',s:['Researchers have found a strong correlation between sleep quality and memory retention.','The study followed two hundred participants over a period of three years.','Although the results are promising, further investigation is required.','Climate change has significantly altered migration patterns in many bird species.']}
];
const CATS=['Tất cả','Tổng hợp','Giao tiếp','Công sở','Học thuật','Tin tức'];
const LVS=['Tất cả','Cơ bản','Trung bình','Nâng cao'];
const LVC={'Cơ bản':'#5EE0A0','Trung bình':'#F5B73D','Nâng cao':'#FF6A82'};

let prog=LS.get('dict.prog',{}),stats=LS.get('dict.stats',{n:0,sum:0}),notes=LS.get('dict.notes',{}),mine=LS.get('dict.mine',[]);
const lessons=()=>[...BASE,...mine];
const F={q:'',cat:'Tất cả',lv:'Tất cả'};
let mode='full',rate=1,P=null;

/* ---------- âm thanh ---------- */
const canSpeak='speechSynthesis' in window;
function voice(){const v=speechSynthesis.getVoices();return v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))}
function say(text,r=rate){
  if(!canSpeak)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=r;const v=voice();if(v)u.voice=v;
  const btn=document.querySelector('.play');
  u.onstart=()=>btn&&btn.classList.add('on');u.onend=u.onerror=()=>document.querySelector('.play')?.classList.remove('on');
  speechSynthesis.speak(u);
}

/* ---------- chấm điểm ---------- */
const clean=w=>w.replace(/[’‘]/g,"'").toLowerCase().replace(/[^a-z0-9']/g,'');
const words=s=>s.trim().split(/\s+/).filter(Boolean);
function align(target,ans){
  const T=target.map(clean),A=ans.map(clean),n=T.length,m=A.length;
  const d=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=T[i]===A[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){
    if(T[i]===A[j]){ops.push({t:'ok',w:target[i]});i++;j++}
    else if(d[i+1][j]>=d[i][j+1]){ops.push({t:'miss',w:target[i],c:T[i]});i++}
    else{ops.push({t:'extra',w:ans[j]});j++}
  }
  while(i<n){ops.push({t:'miss',w:target[i],c:T[i]});i++}
  while(j<m){ops.push({t:'extra',w:ans[j]});j++}
  return ops;
}
const accClass=a=>a>=80?'g':a>=50?'y':'r';

/* ---------- thư viện ---------- */
function stripHTML(){
  const avg=stats.n?Math.round(stats.sum/stats.n)+'%':'–';
  const done=Object.values(prog).filter(p=>p.best>=0).length;
  return `<div class="strip"><div><small>Câu đã luyện</small><b>${stats.n}</b></div><div><small>Độ chính xác trung bình</small><b>${avg}</b></div><div><small>Bài đã hoàn thành</small><b>${done}/${lessons().length}</b></div></div>`;
}
function viewLib(){
  P=null;
  const cats=[...CATS,...(mine.length?['Của tôi']:[])];
  $('app').innerHTML=`
  <div class="head"><div><h1>Luyện nghe chép chính tả</h1><p>Nghe audio tiếng Anh và gõ lại chính xác. Cải thiện kỹ năng nghe mỗi ngày.</p></div>
   <div class="acts"><button class="b2" id="bNew">+ Tạo bài từ văn bản</button><button class="b2" id="bNote">Sổ từ nghe sai <b>${Object.keys(notes).length}</b></button></div></div>
  ${!canSpeak?'<div class="note">Trình duyệt của bạn không hỗ trợ phát giọng đọc, nên bài luyện sẽ không có âm thanh.</div>':''}
  ${stripHTML()}
  <div class="fl">
    <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#98A0CF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Tìm bài..." value="${esc(F.q)}" aria-label="Tìm bài"></label>
    <div class="seg" id="lvs">${LVS.map(l=>`<button data-l="${l}" aria-pressed="${F.lv===l}">${l}</button>`).join('')}</div>
  </div>
  <div class="chips" id="cats">${cats.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${F.cat===c}">${c}</button>`).join('')}</div>
  <div class="grid" id="grid"></div>`;
  $('q').oninput=e=>{F.q=e.target.value.trim();grid()};
  document.querySelectorAll('#lvs button').forEach(b=>b.onclick=()=>{F.lv=b.dataset.l;viewLib()});
  document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{F.cat=b.dataset.c;viewLib()});
  $('bNew').onclick=()=>{$('nErr').textContent='';$('dNew').showModal();$('nText').focus()};
  $('bNote').onclick=openNotes;
  grid();
}
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function grid(){
  const list=lessons().filter(l=>(F.cat==='Tất cả'||l.cat===F.cat)&&(F.lv==='Tất cả'||l.lv===F.lv)&&(!F.q||nz(l.title+' '+l.desc+' '+l.cat).includes(nz(F.q))));
  $('grid').innerHTML=list.length?list.map(l=>{
    const p=prog[l.id],a=LVC[l.lv];
    return `<article class="card" style="--a:${a}" data-id="${l.id}" tabindex="0" role="button" aria-label="${esc(l.title)}">
      ${l.custom?`<button class="del" data-del="${l.id}" aria-label="Xoá bài">✕</button>`:''}
      <div class="cat"><span>${l.cat}</span></div>
      <h3>${esc(l.title)}</h3><p>${esc(l.desc)}</p>
      <div class="meta"><span class="lv">${l.lv}</span><span>${l.s.length} câu</span><span>${l.dur}</span></div>
      ${p?`<div class="best"><div class="t"><i style="width:${p.best}%"></i></div><span>Điểm cao nhất <b>${p.best}%</b></span></div>`:'<div class="best"><span>Chưa làm bài này</span></div>'}
      <div class="cta">${p?'Luyện lại':'Bắt đầu'}</div></article>`}).join(''):
    `<div class="empty"><h2>Không có bài nào</h2><p>Thử đổi từ khoá hoặc bộ lọc, hoặc tạo bài từ văn bản của bạn.</p></div>`;
  document.querySelectorAll('.card').forEach(c=>{
    const go=()=>start(c.dataset.id);
    c.onclick=e=>{if(!e.target.closest('.del'))go()};
    c.onkeydown=e=>{if(e.key==='Enter'&&e.target===c)go()};
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=e=>{e.stopPropagation();
    if(confirm('Xoá bài này?')){mine=mine.filter(x=>x.id!==b.dataset.del);LS.set('dict.mine',mine);delete prog[b.dataset.del];LS.set('dict.prog',prog);if(!mine.length&&F.cat==='Của tôi')F.cat='Tất cả';viewLib()}});
}

/* ---------- luyện ---------- */
function start(id){
  const l=lessons().find(x=>x.id===id);
  P={l,i:0,res:[],replays:0,hints:0,t0:Date.now(),st:'ask',hintN:0,cur:null,blanks:[]};
  viewPlay();
}
function makeBlanks(sentence){
  const w=words(sentence);
  let el=w.map((x,i)=>[i,clean(x).length]).filter(x=>x[1]>=4).map(x=>x[0]);
  if(!el.length){const best=w.map((x,i)=>[i,clean(x).length]).sort((a,b)=>b[1]-a[1])[0];el=[best[0]]}
  return el.filter((_,k)=>k%2===0||el.length===1);
}
function viewPlay(){
  const {l,i}=P,sent=l.s[i];
  const bar=l.s.map((_,k)=>{const r=P.res[k];return `<i class="${r?accClass(r.acc):''} ${k===i&&!r?'now':''}"></i>`}).join('');
  let body='';
  if(P.st==='ask'){
    if(mode==='full'){
      body=`<input class="ans" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ lại những gì bạn nghe được..." aria-label="Câu trả lời">`;
    }else{
      P.blanks=makeBlanks(sent);
      body=`<div class="cloze" id="cloze">${words(sent).map((w,k)=>{
        if(!P.blanks.includes(k))return esc(w)+' ';
        const m=w.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/);
        return `${esc(m[1])}<input data-k="${k}" size="${Math.max(3,m[2].length+1)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Từ thứ ${k+1}">${esc(m[3])} `}).join('')}</div>`;
    }
    const hw=words(sent);
    body+=`<div class="hintline" id="hint">${P.hintN?esc(hw.slice(0,P.hintN).join(' '))+(P.hintN<hw.length?' <s>…</s>':''):''}</div>
    <div class="row"><button class="btn ghost" id="bHint">Gợi ý<span class="kbd">Alt+H</span></button><button class="btn ghost" id="bShow">Xem đáp án</button><span class="sp2"></span><button class="btn" id="bCheck">Kiểm tra<span class="kbd">Enter</span></button></div>`;
  }else{
    const c=P.cur,last=i===l.s.length-1;
    body=`<div class="res" aria-live="polite"><div class="score"><b>${c.revealed?'–':c.acc+'%'}</b><span>${c.revealed?'Bạn đã xem đáp án, câu này tính 0%':c.acc>=90?'Chính xác':c.acc>=60?'Gần đúng, xem lại các từ đánh dấu':'Nghe lại và thử thêm lần nữa'}</span></div>
    <div class="diff">${c.html}</div>
    <div class="leg"><span><i style="color:var(--ok)">xanh</i> đúng</span><span><i style="background:rgba(246,232,92,.18);color:var(--mark)">vàng</i> thiếu / sai</span><span><i style="color:var(--bad);text-decoration:line-through">đỏ gạch</i> thừa</span></div>
    <div class="row"><button class="btn ghost" id="bListen">Nghe lại</button><button class="btn ghost" id="bRetry">Làm lại câu</button><span class="sp2"></span><button class="btn mk" id="bNext">${last?'Xem kết quả':'Câu tiếp'}<span class="kbd" style="border-color:rgba(0,0,0,.3);color:var(--ink)">Enter</span></button></div></div>`;
  }
  $('app').innerHTML=`<div class="pl">
    <div class="pl-top"><button class="back" id="bBack">← Thư viện</button><h2>${esc(l.title)}</h2>
      <div class="seg"><button data-m="full" aria-pressed="${mode==='full'}">Chép cả câu</button><button data-m="cloze" aria-pressed="${mode==='cloze'}">Điền từ thiếu</button></div></div>
    <div class="prog">${bar}</div>
    <div class="pmeta"><span>Câu ${i+1} / ${l.s.length}</span><span>${P.replays} lần nghe lại</span></div>
    <div class="stage">
      <div class="listen">
        <button class="play" id="bPlay" aria-label="Phát câu này"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg><span class="bars"><i></i><i></i><i></i><i></i></span></button>
        <div class="lrow"><button class="replay" id="bRe">Nghe lại<span class="kbd">Alt+R</span></button><span>Tốc độ</span>
          <div class="sp" id="sp">${[0.5,0.75,1,1.25].map(r=>`<button data-r="${r}" aria-pressed="${rate===r}">${r}x</button>`).join('')}</div></div>
      </div>${body}</div></div>`;
  bindPlay();
  if(P.st==='ask'){
    const f=document.querySelector('#ans,#cloze input');f&&f.focus();
    if(!P.played){P.played=true;setTimeout(()=>say(sent),150)}
  }
}
function bindPlay(){
  const sent=P.l.s[P.i];
  $('bBack').onclick=()=>{speechSynthesis.cancel?.();if(P.res.length&&!confirm('Thoát bài giữa chừng? Kết quả sẽ không được lưu.'))return;viewLib()};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;P.st='ask';P.hintN=0;P.played=true;viewPlay()});
  $('bPlay').onclick=()=>say(sent);
  $('bRe').onclick=replay;
  document.querySelectorAll('#sp button').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;document.querySelectorAll('#sp button').forEach(x=>x.setAttribute('aria-pressed',x===b));say(sent)});
  if(P.st==='ask'){
    $('bCheck').onclick=check;$('bHint').onclick=hint;$('bShow').onclick=reveal;
    document.querySelectorAll('#ans,#cloze input').forEach(inp=>inp.onkeydown=e=>{
      if(e.key!=='Enter')return;e.preventDefault();
      const all=[...document.querySelectorAll('#cloze input')];
      if(all.length){const k=all.indexOf(e.target);if(k<all.length-1){all[k+1].focus();return}}
      check();
    });
  }else{
    $('bListen').onclick=()=>say(sent);
    $('bRetry').onclick=()=>{P.st='ask';P.hintN=0;P.played=true;viewPlay()};
    $('bNext').onclick=next;
  }
}
function replay(){if(!P||P.st==null)return;P.replays++;const m=document.querySelector('.pmeta span:last-child');if(m)m.textContent=P.replays+' lần nghe lại';say(P.l.s[P.i])}
function hint(){const n=words(P.l.s[P.i]).length;if(P.hintN<n){P.hintN++;P.hints++;
  const hw=words(P.l.s[P.i]);$('hint').innerHTML=esc(hw.slice(0,P.hintN).join(' '))+(P.hintN<n?' <s>…</s>':'')}}
function check(){
  const sent=P.l.s[P.i],tw=words(sent);let acc,html,missed=[];
  if(mode==='full'){
    const v=$('ans').value;if(!v.trim()){$('ans').focus();return}
    const ops=align(tw,words(v));
    const ok=ops.filter(o=>o.t==='ok').length,extra=ops.filter(o=>o.t==='extra').length;
    acc=Math.round(100*ok/(ok+ops.filter(o=>o.t==='miss').length+extra));
    missed=ops.filter(o=>o.t==='miss'&&o.c.length>=2).map(o=>o.c);
    html=ops.map(o=>`<span class="w ${o.t}">${esc(o.w)}</span>`).join('');
  }else{
    const inputs=[...document.querySelectorAll('#cloze input')];
    if(inputs.every(x=>!x.value.trim())){inputs[0].focus();return}
    let good=0;const map={};
    inputs.forEach(x=>{const k=+x.dataset.k,core=tw[k].replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,'');
      const ok=clean(x.value)===clean(core);if(ok)good++;else missed.push(clean(core));map[k]={ok,typed:x.value.trim(),core}});
    acc=Math.round(100*good/inputs.length);
    html=tw.map((w,k)=>{const m=map[k];if(!m)return `<span class="w plain">${esc(w)}</span>`;
      const mm=w.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/);
      return m.ok?`<span class="w ok">${esc(w)}</span>`:`<span class="w">${m.typed?`<span class="w extra" style="margin:0">${esc(m.typed)}</span> `:''}<span class="w miss" style="margin:0">${esc(mm[2])}</span>${esc(mm[3])}</span>`}).join('');
  }
  P.cur={acc,html,missed};P.st='checked';viewPlay();
  if(acc===100)say('Correct',1.1);
}
function reveal(){
  const sent=P.l.s[P.i];
  P.cur={acc:0,revealed:true,missed:[],html:`<span class="w plain">${esc(sent)}</span>`};P.st='checked';viewPlay();
}
function next(){
  P.res[P.i]=P.cur;
  if(P.i<P.l.s.length-1){P.i++;P.st='ask';P.hintN=0;P.played=false;P.cur=null;viewPlay()}else finish();
}
function finish(){
  speechSynthesis.cancel?.();
  const r=P.res,sum=r.reduce((a,x)=>a+x.acc,0),avg=Math.round(sum/r.length);
  stats.n+=r.length;stats.sum+=sum;LS.set('dict.stats',stats);
  prog[P.l.id]={best:Math.max(avg,prog[P.l.id]?.best??0),last:avg};LS.set('dict.prog',prog);
  P.avg=avg;P.st='done';P.secs=Math.round((Date.now()-P.t0)/1000);viewResult();
}
function viewResult(){
  const {l,res,avg,secs}=P;
  const miss={};res.forEach(x=>x.missed.forEach(w=>miss[w]=(miss[w]||0)+1));
  const mw=Object.keys(miss);
  const mm=Math.floor(secs/60),ss=String(secs%60).padStart(2,'0');
  $('app').innerHTML=`<div class="pl res">
   <div class="pl-top"><button class="back" id="bBack">← Thư viện</button><h2>${esc(l.title)}</h2></div>
   <div class="big"><b>${avg}%</b><p>${avg>=90?'Rất tốt, tai bạn bắt chuẩn gần hết.':avg>=70?'Khá ổn. Xem lại các câu dưới đây.':'Cần luyện thêm. Thử nghe chậm 0.75x.'}</p></div>
   <div class="kp"><div><small>Thời gian</small><b>${mm}:${ss}</b></div><div><small>Lần nghe lại</small><b>${P.replays}</b></div><div><small>Lần dùng gợi ý</small><b>${P.hints}</b></div></div>
   <h2>Từng câu</h2>
   <div class="sl">${l.s.map((s,k)=>`<div><b class="${accClass(res[k].acc)}">${res[k].acc}%</b><span>${esc(s)}</span></div>`).join('')}</div>
   ${mw.length?`<h2>Từ bạn nghe sai</h2><div class="mw">${mw.map(w=>`<button data-w="${esc(w)}" title="Nghe từ này">♪ ${esc(w)}${miss[w]>1?`<span>×${miss[w]}</span>`:''}</button>`).join('')}</div>
   <button class="btn ghost" id="bSave">Lưu ${mw.length} từ vào sổ tay</button>`:'<p style="color:var(--ok);font-weight:600">Không có từ nào bị sai. Chuyển sang bài khó hơn nhé.</p>'}
   <div class="row" style="margin-top:28px"><button class="btn" id="bAgain">Làm lại bài</button><button class="btn ghost" id="bLib">Về thư viện</button></div></div>`;
  $('bBack').onclick=$('bLib').onclick=viewLib;
  $('bAgain').onclick=()=>start(l.id);
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>say(b.dataset.w,0.8));
  const sv=$('bSave');if(sv)sv.onclick=()=>{mw.forEach(w=>notes[w]=(notes[w]||0)+miss[w]);LS.set('dict.notes',notes);sv.textContent='Đã lưu vào sổ tay';sv.disabled=true};
}

/* ---------- sổ từ ---------- */
function openNotes(){
  const ks=Object.keys(notes).sort((a,b)=>notes[b]-notes[a]);
  $('wl').innerHTML=ks.length?ks.map(w=>`<div><strong>${esc(w)}</strong><small>sai ${notes[w]} lần</small><button data-p="${esc(w)}" aria-label="Nghe ${esc(w)}">♪</button><button data-r="${esc(w)}" aria-label="Xoá ${esc(w)}">✕</button></div>`).join(''):
    '<p style="color:var(--mute)">Chưa có từ nào. Sau mỗi bài, bạn có thể lưu những từ nghe sai vào đây.</p>';
  $('wl').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>say(b.dataset.p,0.8));
  $('wl').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{delete notes[b.dataset.r];LS.set('dict.notes',notes);openNotes();const n=document.querySelector('#bNote b');if(n)n.textContent=Object.keys(notes).length});
  if(!$('dNote').open)$('dNote').showModal();
}
$('noteClose').onclick=()=>$('dNote').close();

/* ---------- tạo bài ---------- */
$('nCancel').onclick=()=>$('dNew').close();
$('nOk').onclick=()=>{
  const txt=$('nText').value.replace(/\s+/g,' ').trim();
  const s=(txt.match(/[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g)||[]).map(x=>x.trim()).filter(x=>words(x).length>=3).slice(0,30);
  if(s.length<1){$('nErr').textContent='Cần ít nhất một câu có từ 3 từ trở lên.';return}
  const avgW=s.reduce((a,x)=>a+words(x).length,0)/s.length,total=s.reduce((a,x)=>a+words(x).length,0);
  const secs=Math.round(total/2.5),dur=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const title=$('nTitle').value.trim()||('Bài của tôi '+(mine.length+1));
  mine.push({id:'u'+Date.now(),custom:1,cat:'Của tôi',lv:avgW<8?'Cơ bản':avgW<13?'Trung bình':'Nâng cao',title,desc:`Bài tự tạo gồm ${s.length} câu.`,dur,s});
  LS.set('dict.mine',mine);$('nTitle').value='';$('nText').value='';$('dNew').close();F.cat='Của tôi';F.lv='Tất cả';F.q='';viewLib();
};

/* ---------- phím tắt ---------- */
document.addEventListener('keydown',e=>{
  if(!P||document.querySelector('dialog[open]'))return;
  if(e.altKey&&e.key.toLowerCase()==='r'&&P.st!=='done'){e.preventDefault();replay()}
  if(e.altKey&&e.key.toLowerCase()==='h'&&P.st==='ask'){e.preventDefault();hint()}
  if(e.key==='Enter'&&P.st==='checked'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();next()}
});
if(canSpeak)speechSynthesis.getVoices();
viewLib();
</script>
</body>
</html>
