<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fc" />
    <title>Mất kết nối | IELTS Flow</title>
    <style>
      body {
        margin: 0;
        background: #f6f8fc;
        color: #14213d;
        font-family: system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 42rem;
        min-height: 100vh;
        margin: auto;
        display: grid;
        place-content: center;
        padding: 2rem;
      }
      section {
        background: white;
        border: 1px solid #d6dceb;
        border-radius: 1rem;
        padding: 2rem;
      }
      h1 {
        margin: 0;
        font-size: 1.8rem;
      }
      p {
        line-height: 1.7;
        color: #4d5c7a;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        border: 0;
        border-radius: 0.6rem;
        padding: 0 1.1rem;
        background: #1f4ed8;
        color: white;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #88a4ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <section role="alert">
        <h1>Không có kết nối mạng</h1>
        <p>
          Câu trả lời chưa được xác nhận là đã lưu khi đang offline. Hãy kết nối
          lại rồi tải trang.
        </p>
        <a href="/">Thử kết nối lại</a>
      </section>
    </main>
  </body>
</html>
